<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teresita Flowers</title>
  <meta name="description" content="Arreglos florales hechos a mano. Pide el tuyo por WhatsApp.">
  <style>
    :root {
      --rosa: #d98ba0;
      --verde: #5f7a61;
      --crema: #fdf8f4;
      --texto: #3b3a36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--crema);
      color: var(--texto);
      line-height: 1.6;
    }
    header {
      text-align: center;
      padding: 80px 20px 40px;
    }
    header h1 {
      font-size: 2.8rem;
      font-weight: normal;
      color: var(--verde);
      letter-spacing: 0.04em;
    }
    header p {
      margin-top: 12px;
      font-size: 1.1rem;
      color: var(--rosa);
    }
    section {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px;
      text-align: center;
    }
    section h2 {
      font-weight: normal;
      font-size: 1.6rem;
      color: var(--verde);
      margin-bottom: 16px;
    }
    .boton {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 32px;
      background: var(--verde);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .boton:hover { background: #4a6149; }
    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.9rem;
      color: #8a8680;
    }
  </style>
</head>
<body>

  <header>
    <h1>Teresita Flowers</h1>
    <p>Arreglos florales hechos a mano</p>
  </header>

  <section>
    <h2>Flores para cada ocasión</h2>
    <p>Cumpleaños, aniversarios, condolencias o simplemente porque sí. Creamos un arreglo a tu medida.</p>
    <a class="boton" href="https://wa.me/521XXXXXXXXXX?text=Hola%2C%20quisiera%20pedir%20un%20arreglo%20floral" target="_blank" rel="noopener">Pedir por WhatsApp</a>
  </section>

  <footer>
    &copy; 2026 Teresita Flowers · teresitaflowers.garden
  </footer>

</body>
</html>
